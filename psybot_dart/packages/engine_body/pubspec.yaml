name: engine_body
description: "Body/skeleton tracking sensing layer for PsyBot. Detects the body and publishes landmarks and movement signals; contains no game logic."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.psybot.engine_body
        pluginClass: EngineBodyPlugin
