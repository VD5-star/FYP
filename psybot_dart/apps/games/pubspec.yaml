resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_soloud: ^5.1.1
  google_mlkit_pose_detection: ^0.16.1
